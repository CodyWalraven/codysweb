name: Generic SSH APK
on:
  push:
    branches: [chatgpt/generic-ssh-apk-builder]
    paths: ['apk-builder/**', '.github/workflows/generic-ssh-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - run: gradle -p apk-builder :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: generic-ssh-apk
          path: apk-builder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
